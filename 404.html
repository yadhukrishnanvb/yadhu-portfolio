<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | Yadhu Krishnan VB</title>
  <link rel="stylesheet" href="404.css" />
</head>
<body>
  <main class="error-page">
    <img
      class="error-art"
      src="./assets/404-error.png"
      alt=""
      aria-hidden="true"
    />

    <section class="error-content" aria-labelledby="error-title">
      <p class="error-code">Error 404</p>
      <h1 id="error-title">Oops, I think we’re lost.</h1>
      <p>The page you requested could not be found.</p>
      <a class="home-button" href="./" aria-label="Return to the portfolio home page">
        <span aria-hidden="true">⌂</span>
        Back Home
      </a>
    </section>
  </main>
</body>
</html>
